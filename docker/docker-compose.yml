# Protected GPU environment for the PRISM / QUBO pipeline.
#
# Usage (from samsung_backup/):
#   cp docker/env.example .env   # optional secrets / GPU list
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml run --rm prism bash scripts/run_smoke.sh
#
# Unscheduled containers can restrict NVIDIA_VISIBLE_DEVICES in .env.
# Scheduled jobs must use the cluster-supported container GPU allocation.

services:
  prism:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: prism-qubo:a6000
    working_dir: /workspace
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      HF_HOME: /workspace/cache/huggingface
      TRANSFORMERS_CACHE: /workspace/cache/models
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ..:/workspace
      - ../cache:/workspace/cache
      - ../outputs:/workspace/outputs
      - ../checkpoints:/workspace/checkpoints
    shm_size: "16gb"
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    command: ["bash"]

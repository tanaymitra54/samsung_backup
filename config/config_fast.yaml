hardware:
  gpu: "NVIDIA RTX A6000"
  vram_gb: 48
  multi_gpu: true
  dtype: "bfloat16"

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  cache_dir: "./cache/models"
  load_in_4bit: false
  attn_implementation: "sdpa"
  use_vllm: false
  allow_device_fallback: false
  allow_quantization_fallback: false

pipeline:
  num_answers: 4
  num_reasons: 4
  subset_size: 6
  max_new_tokens: 512
  sampling_max_new_tokens: 512
  temperature_range: [0.3, 0.9]
  top_p: 0.95

verifier:
  math_mode: "calculator"
  nli_model: "cross-encoder/nli-deberta-v3-base"
  nli_threshold: 0.5
  device_map_verifier: null
  # Legacy fusion only. Diagnostic coefficients come from learned_weights.json.
  weights:
    math:
      sc: 0.4
      nli: 0.3
      conf: 0.2
      arith: 0.1
    commonsense:
      sc: 0.5
      nli: 0.3
      conf: 0.2
      arith: 0.0

qubo:
  # Legacy builder settings. Full-pool diagnostics use their learned artifact.
  max_vars: 200
  similarity_metric: "cosine"
  clustering_method: "kmeans"
  penalty_weight: 2.0
  diversity_bonus: 0.5
  hubo_enabled: false
  hubo_triplet_penalty: 1.0
  embedder_device: null
  answer_sim_weight: 1.0
  answer_agree_weight: 0.0
  exact_k: true
  cardinality_penalty: 0.0

solver:
  method: "auto"
  exact_k: true
  exhaustive_max_n: 20
  sa:
    initial_temp: 100.0
    final_temp: 0.01
    cooling_rate: 0.99
    iterations: 500
    num_reads: 2
  gpu:
    enabled: true
    num_parallel_reads: 1024
    use_parallel_tempering: true
    use_counterdiabatic: false

training:
  sft_epochs: 3
  learning_rate: 2e-5
  batch_size: 4
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  output_dir: "./checkpoints"
  use_peft: true
  qlora: true
  iterative_rounds: 3
  benchmark: "gsm8k"
  trace_split: "train"
  trace_examples: 200
  eval_examples: 200
  outputs_dir: "./outputs/qlora_rounds"
  max_seq_length: 2048
  warmup_steps: 0
  warmup_ratio: 0.05

evaluation:
  device: "cuda:0"
  benchmarks:
    - "gsm8k"
    - "bbh"
    - "strategyqa"
    - "arc_challenge"
    - "mmlu"
  subset_size: 50
  full_eval: false
  batch_size: 16
  use_batched_inference: true
  score_with_gold: false
  report_ci: true

diagnostics:
  questions: 20
  calibration_questions: 20
  seeds: [42, 43, 44]
  calibration_seeds: [42]
  sample_seed: 20261013
  outputs_dir: ./outputs/diagnostics_fast
  require_learned_weights: true

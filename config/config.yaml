# ==============================================================================
# FILE: config/config.yaml
# ROLE: Main System Configuration File
#
# Restored keys that the pipeline reads but that were absent from the previous
# revision. Where a key was missing the code fell back to a hard-coded default,
# which was silently wrong in one important case (qubo.cardinality_penalty --
# see the note there). Every restored value is annotated with why it is set.
# ==============================================================================

model:
    # Resolved from the local HF cache below -- the Qwen2.5-3B-Instruct weights
    # are stored as a hub snapshot in ./cache/models, not as a loose directory,
    # so the repo id is the correct reference. Set HF_HUB_OFFLINE=1 to force
    # offline use of the cached copy.
    name: "Qwen/Qwen2.5-3B-Instruct"
    cache_dir: "./cache/models"
    candidates:
        - "Qwen/Qwen2.5-3B-Instruct"
        - "Qwen/Qwen2.5-1.5B-Instruct"
        - "meta-llama/Llama-3.2-3B-Instruct"
    load_in_4bit: false
    attn_implementation: "sdpa"
    use_vllm: false
    vllm:
        dtype: "auto"
        quantization: "fp8"
        tensor_parallel_size: 1
        gpu_memory_utilization: 0.9

pipeline:
    # 4 prompt perturbations x num_answers = candidate pool per question.
    #
    # Raised 3 -> 5 (pool 12 -> 20). Gold-free quality is 65% cross-chain
    # consensus, and a consensus estimate over 12 samples is coarse: one chain is
    # worth 8 percentage points of agreement, so the signal moves in large steps.
    # Self-consistency accuracy is known to keep improving with sample count into
    # the tens (Wang et al. 2023 report gains out to ~40), and the first honest
    # evaluation had majority vote at 60% against CoT's 65% -- close enough that a
    # better-resolved vote is a credible way past it.
    #
    # Cost is linear in sampling, which is ~77% of runtime, so pool 20 is roughly
    # 1.5x the wall time of pool 12. Raise to 6 (pool 24) if the vote decodes look
    # like they are still improving.
    num_answers: 5
    num_reasons: 4
    subset_size: 6
    # Generation budget. 96 tokens cannot hold a multi-step chain of thought --
    # traces get truncated mid-derivation, which starves the verifier's
    # arithmetic-consistency signal and the final scaffold alike.
    max_new_tokens: 512
    # Raised from 256. Chains are parsed for a trailing "Answer:" line, and a
    # chain truncated before that line has answer="" -- which contributes nothing
    # to cross-chain consensus, the term carrying 65% of the gold-free quality
    # score. The first honest evaluation showed quality scores clustered at
    # 0.11-0.38, consistent with consensus being largely dead. Batched sampling
    # (see DiverseSampler.generate_batch) pays for the extra tokens.
    sampling_max_new_tokens: 448
    sampling_max_input_tokens: 768
    temperature_range: [0.3, 0.9]
    top_p: 0.95

verifier:
    math_mode: "calculator"        # calculator | symbolic
    nli_model: "cross-encoder/nli-distilroberta-base"
    nli_threshold: 0.5
    device_map_verifier: null

    # -----------------------------------------------------------------------
    # SCORING WEIGHTS -- how quality_score is computed per task type. Absent
    # from the previous revision, so every weight below was running on a code
    # default and could not be tuned without editing Python.
    #
    # MATH:     score = math_answer_weight x answer_match
    #                 + math_consistency_weight x arithmetic_consistency
    # LANGUAGE: score = lang_nli_weight x P(entailment)
    #                 + lang_coverage_weight x lexical_coverage
    #                 + lang_structure_weight x structural_depth
    # -----------------------------------------------------------------------
    scoring:
        math_answer_weight:      0.63   # answer correctness (oracle signal)
        math_consistency_weight: 0.27   # arithmetic correctness (process signal)
        consensus_weight:        0.10   # cross-chain majority vote

        lang_nli_weight:         0.60   # entailment: does the reasoning support the answer
        lang_coverage_weight:    0.25   # lexical coverage of the question
        lang_structure_weight:   0.15   # multi-step structure
        structure_mu:            1.5    # sigmoid inflection (sentence count)
        structure_tau:           1.0    # sigmoid softness

        # -------------------------------------------------------------------
        # GOLD-FREE SCORING (evaluation / deployment).
        #
        # The weights above assume a gold answer, which is true only when
        # curating TRAINING data. At evaluation no answer key exists, so chain
        # quality comes from signals the model can compute unaided:
        #   consensus -- fraction of sibling chains reaching the same answer
        #                (self-consistency); the strongest gold-free proxy.
        #   base      -- arithmetic consistency (math) or the NLI/coverage/
        #                structure composite (language). Process quality only.
        # Must sum to 1.0.
        # -------------------------------------------------------------------
        gold_free_consensus_weight:   0.65
        gold_free_consistency_weight: 0.35

qubo:
    max_vars: 200
    similarity_metric: "cosine"
    clustering_method: "kmeans"
    penalty_weight: 2.0
    diversity_bonus: 0.5
    hubo_enabled: false
    hubo_triplet_penalty: 1.0
    embedder_device: null

    # Answer-aware off-diagonal: Q[i][j] = (a*cosine + b*answer_agree) * penalty_weight.
    # Two chains reaching the same answer are logically redundant even when their
    # embeddings look diverse. Empty-answer chains never count as agreeing.
    answer_sim_weight:   0.6
    answer_agree_weight: 0.4

    # Soft cardinality constraint, penalising solutions where sum(x_i) != subset_size.
    #
    # IMPORTANT: this was absent, so it fell back to 0.1 -- and at 0.1 against
    # penalty_weight 2.0 the pairwise redundancy penalty swamps the k-constraint
    # entirely. Measured on a 12-chain pool, the solver then selects exactly ONE
    # chain, so the final prompt carries no reasoning diversity at all and the
    # multi-chain premise of the method never engages.
    #
    # 0.8 was chosen by measurement (0.1 -> 1 chain, 0.8 -> 3 chains at
    # penalty_weight 2.0). Treat it as a working starting point, not a tuned
    # value: scripts/tune_qubo_params.py now searches 0.2-1.2 and should set it.
    # run_all_benchmarks.py reports the mean selected-chain count and warns if it
    # collapses below 2 again.
    cardinality_penalty: 0.8

    # Top-k representatives per semantic cluster fed to the QUBO. Taking 2 rather
    # than 1 lets the solver trade off within a cluster instead of being handed a
    # single fixed representative.
    top_k_per_cluster: 2

solver:
    method: "simulated_annealing"  # simulated_annealing | tabu | quantum
    sa:
        initial_temp: 100.0
        final_temp: 0.01
        cooling_rate: 0.99
        iterations: 500
        num_reads: 2
    gpu:
        enabled: true
        num_parallel_reads: 1024
        use_parallel_tempering: true
        use_counterdiabatic: false

training:
    sft_epochs: 3
    learning_rate: 2e-5
    batch_size: 8
    lora_rank: 16
    lora_alpha: 32
    lora_dropout: 0.05
    lora_target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    output_dir: "./checkpoints"
    use_peft: true
    iterative_rounds: 3
    max_seq_length: 2048
    warmup_steps: 100

evaluation:
    device: "cuda:0"
    benchmarks:
        - "gsm8k"
        - "bbh"
        - "strategyqa"
        - "arc_challenge"
        - "mmlu"
    # Accuracy standard error is sqrt(0.25/n): n=200 gives +/-3.5 points, n=300
    # gives +/-2.9. Below ~300 the run cannot resolve the size of improvement
    # this pipeline is trying to demonstrate.
    subset_size: 300
    full_eval: false
    # Questions per batched generation call for the greedy and CoT baselines.
    # generate_answers_batch ignored this entirely and ran at batch 1 until it was
    # fixed; 16 is comfortable for a 3B model on an 80GB card and the code halves
    # the batch automatically on OOM.
    batch_size: 16
    use_batched_inference: true
